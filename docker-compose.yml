version: '3.8'
services:
  postgres:
    # pgvector 포함 이미지 — RAG(정책 임베딩) 활성화에 필요. 순정 postgres에는 vector 확장이 없음.
    image: pgvector/pgvector:pg16
    container_name: crisfin-postgres
    environment:
      POSTGRES_DB: crisfin
      POSTGRES_USER: crisfin
      POSTGRES_PASSWORD: crisfin
    ports:
      - "5432:5432"
    volumes:
      - crisfin-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisfin -d crisfin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crisfin-pg-data:
