spring:
  application:
    name: crisfin-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crisfin}
    username: ${DB_USERNAME:crisfin}
    password: ${DB_PASSWORD:crisfin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
server:
  port: 8080
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
jwt:
  secret: ${JWT_SECRET:crisfin-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-testing}
  access-expiration: 1800000
  refresh-expiration: 604800000
llm:
  providers:
    # 사용할 LLM 우선순위. 환경변수 LLM_PROVIDERS_ORDER로 덮어쓰기 가능.
    # 예) OPENAI 키만 있으면 LLM_PROVIDERS_ORDER=OPENAI 로 두면 폴백 실패 호출 없이 바로 사용.
    order: ${LLM_PROVIDERS_ORDER:GEMINI,CLAUDE,OPENAI}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-pro
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
  openai:
    api-key: ${OPENAI_API_KEY:}
    # 챗 모델. 환경변수 OPENAI_MODEL로 덮어쓰기 가능. 기본은 저비용 gpt-4o-mini.
    model: ${OPENAI_MODEL:gpt-4o-mini}
# Hybrid RAG embeddings — disabled automatically when the API key is blank.
embedding:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: text-embedding-3-small
    dimensions: 1536
  rag:
    top-k: ${RAG_TOP_K:5}
    # 앱 기동 시 policy_embeddings가 비어 있고 임베딩이 활성화돼 있으면 1회 자동 색인.
    # 이미 채워져 있으면 건너뛰므로 재시작해도 중복 임베딩/비용이 없다.
    auto-index-on-startup: ${RAG_AUTO_INDEX_ON_STARTUP:true}
welfare:
  api:
    key: ${PUBLIC_DATA_API_KEY:}
    base-url: http://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations
    # 동기화 상한 및 페이지 크기 (목록 페이지네이션).
    max-items: 1000
    page-size: 100
# Paid analysis (mock payment) — price in KRW, immediate entitlement on confirm.
payment:
  price: ${PAYMENT_PRICE:9900}
  plan: ${PAYMENT_PLAN:STANDARD}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
logging:
  level:
    com.finfive.crisfin: INFO
