spring:
  application:
    name: crisfin-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crisfin}
    username: ${DB_USERNAME:crisfin}
    password: ${DB_PASSWORD:crisfin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
server:
  port: 8080
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
jwt:
  secret: ${JWT_SECRET:crisfin-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-testing}
  access-expiration: 1800000
  refresh-expiration: 604800000
llm:
  providers:
    order: GEMINI,CLAUDE,OPENAI
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-pro
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-6
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o
# Hybrid RAG embeddings — disabled automatically when the API key is blank.
embedding:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: text-embedding-3-small
    dimensions: 1536
  rag:
    top-k: ${RAG_TOP_K:5}
welfare:
  api:
    key: ${PUBLIC_DATA_API_KEY:}
    base-url: https://api.odcloud.kr/api/15090532/v1
# Paid analysis (mock payment) — price in KRW, immediate entitlement on confirm.
payment:
  price: ${PAYMENT_PRICE:9900}
  plan: ${PAYMENT_PLAN:STANDARD}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
logging:
  level:
    com.finfive.crisfin: INFO
